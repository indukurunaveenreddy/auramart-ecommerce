services:
  - type: web
    name: auramart-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: UPI_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
